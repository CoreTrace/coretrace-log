# SPDX-License-Identifier: MIT
name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            sanitizers: address,undefined
          - name: TSan
            sanitizers: thread

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      # The runner kernel's high ASLR entropy makes the GCC sanitizer runtimes
      # abort with "unexpected memory mapping".
      - name: Lower ASLR entropy for the sanitizer runtimes
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizers }} -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizers }}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
