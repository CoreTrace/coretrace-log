name: clang-format

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format 20
        run: pipx install clang-format==20.1.8

      - name: Run format-check
        run: ./scripts/format-check.sh
